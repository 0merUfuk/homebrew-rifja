name: Rifja install
on:
  push:
    paths: ['Formula/rifja.rb', '.github/workflows/rifja.yml']
  pull_request:
    paths: ['Formula/rifja.rb', '.github/workflows/rifja.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and test the hosted release
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          # Refresh the runner image's package manager before testing this tap.
          brew update
          # Current Homebrew requires trusting a non-core tap before its
          # formulas load; installation then trusts only the requested formula.
          brew trust --formula 0merUfuk/rifja/rifja
          brew install --verbose 0merUfuk/rifja/rifja
          # Test this checked-out formula, including pull-request changes.
          cp Formula/rifja.rb "$(brew --repository 0merUfuk/rifja)/Formula/rifja.rb"
          brew reinstall --verbose 0merUfuk/rifja/rifja
          rifja --version
          brew test 0merUfuk/rifja/rifja
          brew reinstall 0merUfuk/rifja/rifja
          rifja --version
          brew uninstall --force 0merUfuk/rifja/rifja
